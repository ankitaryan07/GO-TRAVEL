<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — GO-TRAVEL</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="auth-wrap">
        <div class="auth-card">
            <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:4px;">
                <div style="width:40px;height:40px;background:linear-gradient(135deg,#E8771E,#f59e0b);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 14px rgba(232,119,30,.5);">✈</div>
                <h1 style="margin:0;">GO<span>-TRAVEL</span></h1>
            </div>
            <p class="subtitle">Welcome back — log in to continue</p>
            <div id="msg"></div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="e.g., rahul@gmail.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="e.g., your password">
            </div>
            <button class="btn btn-block" onclick="doLogin()">Login</button>
            <p class="switch" style="margin-top:12px;">
                <a href="/forgot-password">Forgot Password?</a>
            </p>
            <p class="switch">Don't have an account? <a href="/signup">Sign Up</a></p>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
    <script>
        async function doLogin() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const msg = document.getElementById("msg");
            msg.innerHTML = "";
            if (!email || !password) {
                msg.innerHTML = '<div class="alert alert-error">Please fill all fields</div>';
                return;
            }
            try {
                const data = await loginRequest(email, password);
                saveToken(data.access_token);
                saveUser(data.user);
                // Admin ho to admin panel, warna normal dashboard
                if (data.user.is_admin === 1) {
                    window.location.href = "/admin";
                } else {
                    window.location.href = "/dashboard";
                }
            } catch (e) {
                msg.innerHTML = '<div class="alert alert-error">' + e.message + '</div>';
            }
        }
        document.addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
    </script>
    <script src="/static/js/travel-bg.js"></script>
</body>
</html>
